name: RegalNative
options:
  bundleIdPrefix: com.germy.regalpoc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Pinned by revision (v2.4.2): MMKV's manifest uses unsafeFlags, which SPM rejects for version requirements.
  MMKV:
    url: https://github.com/Tencent/MMKV
    revision: ad7657ef9d120dbcdd7432d75aa6c59391149b22
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RegalNative:
    type: application
    platform: iOS
    sources:
      - Sources
      - TicketKitCore
      - path: MockData
        buildPhase: resources
    dependencies:
      - package: MMKV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.germy.regalpoc.RegalNative
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Regal POC
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
  RegalNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RegalNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.germy.regalpoc.RegalNativeTests
schemes:
  RegalNative:
    build:
      targets:
        RegalNative: all
        RegalNativeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RegalNativeTests
